name: glucotrack
description: "A new Flutter project for tracking glucose levels."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.0
  cupertino_icons: ^1.0.6
  intl: 0.20.2
  firebase_auth: ^5.1.1       
  fl_chart: ^0.66.0
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.6.0
  shared_preferences: ^2.3.2
  easy_localization: ^3.0.7
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  permission_handler: ^12.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lang/ar.json
    - assets/lang/en.json
    - assets/images/logo_light.png
    - assets/images/logo_dark.png